name: Deploy to prod

# A PR merged into prod is a push to prod, so this fires on every deploy.
# workflow_dispatch adds a manual "Run workflow" button for redeploys.
on:
  push:
    branches: [prod]
  workflow_dispatch: {}

# All three repos share this group name, so deploys never overlap on the server.
concurrency:
  group: divedata-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and redeploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: bash ${{ secrets.DEPLOY_PATH }}/deploy.sh
